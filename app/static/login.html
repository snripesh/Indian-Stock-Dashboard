<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Indian Income Assets Dashboard</title>
  <style>
    :root {
      --bg: #080b12;
      --panel: #111827;
      --panel2: #0f172a;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --line: #243044;
      --accent: #8b5cf6;
      --blue: #38bdf8;
      --error: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top left, #1e1b4b, transparent 28%), 
                  radial-gradient(circle at bottom right, #0f172a, transparent 28%), var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.025));
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 24px 50px rgba(0,0,0,.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      animation: fadeIn 0.6s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #e5e7eb, var(--muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo p {
      color: var(--muted);
      margin: 8px 0 0 0;
      font-size: 14px;
    }
    .input-group {
      margin-bottom: 20px;
    }
    .input-group label {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .input-group input {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      outline: none;
      font-size: 15px;
      transition: all 0.2s ease;
    }
    .input-group input:focus {
      border-color: var(--accent);
      background: rgba(15, 23, 42, 0.8);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
    }
    .error-msg {
      color: var(--error);
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
      text-align: center;
      background: rgba(239, 68, 68, 0.1);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    button {
      width: 100%;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), #2563eb);
      color: white;
      border: 0;
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }
    button:active {
      transform: translateY(1px);
    }
    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo">
      <h1>Dashboard Login</h1>
      <p>Secure access to your income assets.</p>
    </div>
    
    <div id="errorMsg" class="error-msg">Invalid credentials.</div>
    
    <form id="loginForm">
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="admin" required autocomplete="username" />
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button type="submit" id="submitBtn">Sign In</button>
      <div style="text-align:center; margin-top:20px; font-size:14px; color:var(--muted);">
        Don't have an account? <a href="/register" style="color:var(--blue); text-decoration:none; font-weight:600;">Register here</a>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      
      errorMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Authenticating...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        if (res.ok) {
          window.location.href = '/';
        } else {
          const data = await res.json();
          errorMsg.textContent = data.error || 'Invalid credentials.';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = 'Connection error. Please try again.';
        errorMsg.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
